<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHRIS AI | UNIVERSE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* --- Deep Space UI --- */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

body { 
  height: 100vh; 
  /* Fixed Background: Deep Space with CSS Stars */
  background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
  display: flex; 
  flex-direction: column; 
  color: #fff; 
  overflow: hidden;
}

/* --- Premium Navbar --- */
.nav { 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  padding: 15px 40px; 
  backdrop-filter: blur(20px);
  background: rgba(0, 0, 0, 0.6); 
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  z-index: 1000;
}
.logo { font-weight: 700; font-size: 22px; letter-spacing: 2px; color: #1fd1f9; }

/* --- DIGITAL CLOCK --- */
#clock {
  font-family: 'Courier New', monospace;
  color: #b621ff;
  font-weight: 700;
  font-size: 18px;
  text-shadow: 0 0 10px rgba(182, 33, 255, 0.5);
}

/* --- Container --- */
.container { 
  flex: 1; 
  display: flex; 
  flex-direction: column;
  justify-content: center; 
  align-items: center; 
  padding: 20px; 
}

.chat-box { 
  width: 600px; 
  max-width: 95%; 
  height: 65vh; 
  background: rgba(255, 255, 255, 0.03); 
  border-radius: 25px; 
  backdrop-filter: blur(15px); 
  border: 1px solid rgba(255, 255, 255, 0.1);
  display: flex; 
  flex-direction: column; 
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.chat { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }

/* --- Messages --- */
.msg { padding: 14px 20px; border-radius: 20px; max-width: 80%; font-size: 15px; line-height: 1.5; }
.user { align-self: flex-end; background: linear-gradient(135deg, #1fd1f9, #b621ff); box-shadow: 0 5px 15px rgba(31, 209, 249, 0.3); }
.bot { align-self: flex-start; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.05); }

/* --- Space-Themed Loading Indicator --- */
.loader-msg { align-self: flex-start; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.02); display: flex; gap: 6px; align-items: center; padding: 14px 25px; }
.dot { width: 8px; height: 8px; background: #1fd1f9; border-radius: 50%; animation: pulse 1.4s infinite ease-in-out both; }
.dot:nth-child(2) { animation-delay: 0.2s; background: #9b70ff; }
.dot:nth-child(3) { animation-delay: 0.4s; background: #b621ff; }

@keyframes pulse {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; box-shadow: 0 0 0px rgba(31,209,249,0); }
  40% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 10px rgba(182,33,255,0.8); }
}

/* --- Input Area --- */
.input-area { display: flex; padding: 20px; background: rgba(0,0,0,0.2); }
input { 
  flex: 1; padding: 15px 20px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); 
  background: rgba(0,0,0,0.3); color: #fff; outline: none;
}
button.send { 
  margin-left: 10px; padding: 0 25px; border-radius: 25px; border: none; 
  background: #1fd1f9; color: #fff; cursor: pointer; font-weight: 600; transition: 0.3s;
}
button.send:hover { background: #b621ff; transform: scale(1.05); }
button:disabled { opacity: 0.3; cursor: not-allowed; }

</style>
</head>
<body>

<div class="nav">
  <div class="logo">CHRIS AI</div>
  <div id="clock">00:00:00</div> <button style="background:none; border:1px solid #1fd1f9; color:#1fd1f9; border-radius:10px; padding:5px 15px;">v2.5</button>
</div>

<div class="container">
  <div style="text-align:center; margin-bottom:20px;">
    <h1 style="font-size:32px; letter-spacing:2px;">SYSTEM ONLINE</h1>
    <p style="opacity:0.5;">Welcome back, Chris.</p>
  </div>

  <div class="chat-box">
    <div id="chat" class="chat"></div>
    <div class="input-area">
      <input id="input" placeholder="Initiate transmission..." autofocus onkeydown="if(event.key==='Enter') send()" />
      <button id="send-btn" class="send" onclick="send()">SEND</button>
    </div>
  </div>
</div>

<script>
// --- DIGITAL CLOCK LOGIC ---
function updateClock() {
    const now = new Date();
    const time = now.getHours().toString().padStart(2, '0') + ":" + 
                 now.getMinutes().toString().padStart(2, '0') + ":" + 
                 now.getSeconds().toString().padStart(2, '0');
    document.getElementById('clock').innerText = time;
}
setInterval(updateClock, 1000);
updateClock();

// --- MESSAGE LOGIC ---
let isProcessing = false;

async function send() {
  const input = document.getElementById("input");
  const btn = document.getElementById("send-btn");
  const message = input.value.trim();

  if (!message || isProcessing) return;

  isProcessing = true;
  btn.disabled = true;
  add(message, "user");
  input.value = "";

  // Show space loading dots
  showLoader();

  try {
    const res = await fetch("/api/chat", { // MAKE SURE THIS MATCHES YOUR BACKEND PATH
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message })
    });
    
    const data = await res.json();

    // Hide loader right before displaying response
    removeLoader();

    if (res.status === 429) {
      add("SYSTEM OVERLOAD: Please wait 60 seconds.", "bot");
    } else if (data.reply) {
      add(data.reply, "bot");
    } else {
      add("SIGNAL LOST: Re-attempt transmission.", "bot");
    }

  } catch(e) { 
    removeLoader();
    add("CRITICAL ERROR: Connection to core failed.", "bot"); 
  } finally {
    isProcessing = false;
    btn.disabled = false;
    input.focus();
  }
}

function add(text, type) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// --- LOADER HELPER FUNCTIONS ---
function showLoader() {
  const chat = document.getElementById("chat");
  const loaderDiv = document.createElement("div");
  loaderDiv.id = "space-loader";
  loaderDiv.className = "msg loader-msg";
  
  loaderDiv.innerHTML = `
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  `;
  
  chat.appendChild(loaderDiv);
  chat.scrollTop = chat.scrollHeight;
}

function removeLoader() {
  const loader = document.getElementById("space-loader");
  if (loader) {
    loader.remove();
  }
}
</script>

</body>
</html>
