<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Nexus</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  height: 100vh;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: white;
  display: flex;
  flex-direction: column;
}

/* NAVBAR */
.nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 40px;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(10px);
}

.logo {
  font-weight: bold;
  font-size: 18px;
  letter-spacing: 1px;
}

.nav button {
  background: #6366f1;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  color: white;
  cursor: pointer;
}

/* HERO */
.hero {
  text-align: center;
  padding: 40px 20px;
}

.hero h1 {
  font-size: 36px;
  background: linear-gradient(90deg, #6366f1, #22c55e);
  -webkit-background-clip: text;
  color: transparent;
}

.hero p {
  opacity: 0.7;
  margin-top: 10px;
}

/* CHAT CONTAINER */
.container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

.chat-box {
  width: 500px;
  height: 500px;
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(20px);
  box-shadow: 0 0 50px rgba(0,0,0,0.6);
  overflow: hidden;
}

.chat {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.msg {
  padding: 12px 16px;
  margin-bottom: 10px;
  border-radius: 14px;
  max-width: 80%;
}

.user {
  background: #6366f1;
  align-self: flex-end;
}

.bot {
  background: rgba(255,255,255,0.1);
  align-self: flex-start;
}

/* INPUT */
.input-area {
  display: flex;
  padding: 10px;
  background: rgba(255,255,255,0.05);
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
}

button.send {
  margin-left: 10px;
  padding: 12px 16px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="nav">
  <div class="logo">AI Nexus</div>
  <button>Upgrade</button>
</div>

<div class="hero">
  <h1>Your Personal AI</h1>
  <p>Powered by next-gen intelligence</p>
</div>

<div class="container">
  <div class="chat-box">
    <div id="chat" class="chat"></div>

    <div class="input-area">
      <input id="input" placeholder="Ask anything..." />
      <button class="send" onclick="send()">Send</button>
    </div>
  </div>
</div>

<script>
async function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const message = input.value;
  if (!message) return;

  add(message, "user");
  input.value = "";

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ message }),
  });

  const data = await res.json();
  add(data.reply, "bot");
}

function add(text, type) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");

  div.className = "msg " + type;
  div.innerText = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
