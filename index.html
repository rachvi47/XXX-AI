<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Nexus Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Reset & base */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { height: 100vh; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); display: flex; flex-direction: column; color: #fff; }

/* Navbar */
.nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; backdrop-filter: blur(12px); background: rgba(255,255,255,0.05); border-radius: 0 0 20px 20px; }
.logo { font-weight: 700; font-size: 22px; letter-spacing: 1px; }
.nav button { background: #ff6ec7; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.2s; }
.nav button:hover { background: #f93dc5; }

/* Hero */
.hero { text-align: center; margin: 40px 20px; }
.hero h1 { font-size: 44px; background: linear-gradient(90deg, #ff6ec7, #1fd1f9); -webkit-background-clip: text; color: transparent; }
.hero p { opacity: 0.7; margin-top: 12px; font-size: 18px; }

/* Chat Container */
.container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
.chat-box { width: 500px; max-width: 95%; height: 600px; display: flex; flex-direction: column; background: rgba(255,255,255,0.05); border-radius: 30px; backdrop-filter: blur(20px); box-shadow: 0 10px 40px rgba(0,0,0,0.5); overflow: hidden; }

/* Chat messages */
.chat { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.msg { padding: 14px 18px; border-radius: 20px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
.user { align-self: flex-end; background: linear-gradient(120deg, #ff6ec7, #1fd1f9); color: #fff; box-shadow: 0 5px 20px rgba(255,110,199,0.3); }
.bot { align-self: flex-start; background: rgba(255,255,255,0.1); color: #fff; }

/* Input area */
.input-area { display: flex; padding: 15px; background: rgba(255,255,255,0.05); }
input { flex: 1; padding: 14px 18px; border-radius: 18px; border: none; outline: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 16px; }
input::placeholder { color: rgba(255,255,255,0.5); }
button.send { margin-left: 12px; padding: 14px 20px; border-radius: 18px; border: none; background: #1fd1f9; color: #fff; cursor: pointer; font-weight: 600; transition: 0.2s; }
button.send:hover { background: #0ac5e0; }

/* Scrollbar */
.chat::-webkit-scrollbar { width: 6px; }
.chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
</style>
</head>
<body>

<div class="nav">
  <div class="logo">AI Nexus</div>
  <button>Premium</button>
</div>

<div class="hero">
  <h1>Next-Gen AI</h1>
  <p>Ask anything, powered by Gemini</p>
</div>

<div class="container">
  <div class="chat-box">
    <div id="chat" class="chat"></div>
    <div class="input-area">
      <input id="input" placeholder="Type your question..." />
      <button class="send" onclick="send()">Send</button>
    </div>
  </div>
</div>

<script>
async function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const message = input.value.trim();
  if (!message) return;
  add(message, "user");
  input.value = "";
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message })
    });
    const data = await res.json();
    add(data.reply, "bot");
  } catch(e) { add("Error connecting to AI","bot"); }
}

function add(text, type) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
