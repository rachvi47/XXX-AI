<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XXX AI - Universe Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* --- Deep Space Reset & Base --- */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

body { 
  height: 100vh; 
  /* Premium Background: Animated Space Gradient + Nebula */
  background: 
    radial-gradient(circle at bottom, #111 0%, #000 100%),
    url('https://images.unsplash.com/photo-1506318137071-a8e063b4bcc0?q=80&w=2560') no-repeat center center fixed;
  background-size: cover;
  display: flex; 
  flex-direction: column; 
  color: #fff; 
  overflow: hidden; /* Prevents body scroll */
}

/* --- Premium Glassmorphism Navbar --- */
.nav { 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  padding: 15px 50px; 
  backdrop-filter: blur(20px) saturate(180%);
  background: rgba(10, 10, 15, 0.5); 
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1000;
}
.logo { 
  font-weight: 700; 
  font-size: 24px; 
  letter-spacing: 2px; 
  background: linear-gradient(90deg, #1fd1f9, #b621ff);
  -webkit-background-clip: text;
  color: transparent;
  text-transform: uppercase;
}
.nav button { 
  background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
  border: none; 
  padding: 10px 25px; 
  border-radius: 30px; 
  cursor: pointer; 
  color: white;
  font-weight: 600; 
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: 0.3s rgba(37, 117, 252, 0.5);
  box-shadow: 0 4px 15px rgba(37, 117, 252, 0.3);
}
.nav button:hover { 
  box-shadow: 0 6px 20px rgba(37, 117, 252, 0.6);
  transform: translateY(-1px);
}

/* --- Hero Section (Simplified for Premium Feel) --- */
.hero { 
  text-align: center; 
  margin-top: 120px; /* Space for fixed nav */
  margin-bottom: 30px;
}
.hero h1 { 
  font-size: 50px; 
  font-weight: 700;
  background: linear-gradient(120deg, #fff 0%, #1fd1f9 50%, #b621ff 100%);
  -webkit-background-clip: text; 
  color: transparent; 
  letter-spacing: -1px;
}
.hero p { 
  opacity: 0.6; 
  margin-top: 5px; 
  font-size: 18px; 
  font-weight: 300;
}

/* --- Premium Floating Chat Container --- */
.container { 
  flex: 1; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  padding: 20px; 
  padding-bottom: 40px;
}
.chat-box { 
  width: 650px; /* Wider for premium feel */
  max-width: 95%; 
  height: 70vh; /* Responsive height */
  max-height: 750px;
  display: flex; 
  flex-direction: column; 
  background: rgba(15, 15, 25, 0.65); /* Dark Glass */
  border-radius: 25px; 
  backdrop-filter: blur(25px) saturate(150%); 
  border: 1px solid rgba(255, 255, 255, 0.06);
  box-shadow: 0 20px 60px rgba(0,0,0,0.7); 
  overflow: hidden; 
  transition: 0.3s ease;
}

/* --- Premium Message Bubbles --- */
.chat { 
  flex: 1; 
  padding: 30px; 
  overflow-y: auto; 
  display: flex; 
  flex-direction: column; 
  gap: 15px; 
}
.msg { 
  padding: 16px 22px; 
  border-radius: 18px; 
  max-width: 75%; 
  line-height: 1.5; 
  font-size: 15px;
  font-weight: 300;
  word-wrap: break-word; 
  transition: 0.2s ease;
}
/* User Message: Neon Glow Gradient */
.user { 
  align-self: flex-end; 
  background: linear-gradient(135deg, #1fd1f9 0%, #b621ff 100%);
  color: #fff; 
  box-shadow: 0 8px 25px rgba(31, 209, 249, 0.3);
  border-bottom-right-radius: 4px; /* Premium bubble style */
}
/* Bot Message: Subtly translucent */
.bot { 
  align-self: flex-start; 
  background: rgba(255, 255, 255, 0.05); 
  color: rgba(255, 255, 255, 0.9);
  border: 1px solid rgba(255,255,255,0.03);
  border-bottom-left-radius: 4px;
}

/* --- Premium Input Area --- */
.input-area { 
  display: flex; 
  padding: 20px; 
  background: rgba(10, 10, 15, 0.4); 
  border-top: 1px solid rgba(255, 255, 255, 0.06);
}
input { 
  flex: 1; 
  padding: 16px 22px; 
  border-radius: 30px; 
  border: 1px solid rgba(255, 255, 255, 0.05); 
  outline: none; 
  background: rgba(0, 0, 0, 0.2); 
  color: #fff; 
  font-size: 16px; 
  font-weight: 300;
  transition: 0.3s;
}
input::placeholder { color: rgba(255,255,255,0.3); }
input:focus { 
  border-color: rgba(31, 209, 249, 0.5);
  background: rgba(0, 0, 0, 0.3);
  box-shadow: 0 0 15px rgba(31, 209, 249, 0.1);
}

/* --- Premium Send Button --- */
button.send { 
  margin-left: 15px; 
  padding: 0 30px;
  border-radius: 30px; 
  border: none; 
  background: linear-gradient(135deg, #1fd1f9 0%, #0ac5e0 100%);
  color: #fff; 
  cursor: pointer; 
  font-weight: 600; 
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: 0.3s; 
  box-shadow: 0 4px 15px rgba(31, 209, 249, 0.3);
}
button.send:hover { 
  box-shadow: 0 6px 20px rgba(31, 209, 249, 0.6);
  transform: translateY(-1px);
}
/* Premium Disabled State */
button:disabled { 
  opacity: 0.4; 
  cursor: not-allowed; 
  background: #444 !important;
  box-shadow: none !important;
}

/* --- Premium Scrollbar --- */
.chat::-webkit-scrollbar { width: 8px; }
.chat::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
.chat::-webkit-scrollbar-thumb { 
  background: rgba(255, 255, 255, 0.05); 
  border-radius: 10px; 
}
.chat::-webkit-scrollbar-thumb:hover { background: rgba(31, 209, 249, 0.2); }

/* --- Responsiveness --- */
@media (max-width: 768px) {
  .nav { padding: 15px 25px; }
  .logo { font-size: 20px; }
  .hero h1 { font-size: 36px; }
  .container { padding: 10px; }
  .chat-box { height: 80vh; border-radius: 20px; }
  .chat { padding: 20px; }
  .msg { max-width: 85%; font-size: 14px; }
}
</style>
</head>
<body>

<div class="nav">
  <div class="logo">XXX AI</div>
  <button>PREMIUM</button>
</div>

<div class="hero">
  <h1>Awaiting Protocol</h1>
  <p>Your universe of knowledge begins here.</p>
</div>

<div class="container">
  <div class="chat-box">
    <div id="chat" class="chat"></div>
    <div class="input-area">
      <input id="input" placeholder="Initiate sequence..." autofocus onkeydown="if(event.key==='Enter') send()" />
      <button id="send-btn" class="send" onclick="send()">Transmit</button>
    </div>
  </div>
</div>

<script>

  isProcessing = true;
  btn.disabled = true; // Premium disabled state in CSS handles the look
  btn.innerText = "Transmitting..."; // Changes text for better UX

    });

    if (res.status === 429) {
